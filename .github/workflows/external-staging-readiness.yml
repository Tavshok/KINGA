name: External Staging Foundation

on:
  pull_request:
    paths:
      - "server/_core/runtime-readiness.ts"
      - "server/_core/runtime-readiness.test.ts"
      - "server/_core/runtime-listen.ts"
      - "server/_core/runtime-listen.test.ts"
      - "server/_core/index.ts"
      - "Dockerfile"
      - "apt.txt"
      - ".github/workflows/external-staging-readiness.yml"
      - "docs/KINGA_EXTERNAL_STAGING_FOUNDATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinga-external-runtime-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Runtime and external-staging contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab # 10.11 multi-platform manifest; linux/amd64 child sha256:5ae7fc7b20f8e07c0ee169ff24617b39cb99b4bfc147555cea758baa69834d9e
        env:
          MARIADB_ROOT_PASSWORD: kinga_ci_root
          MARIADB_DATABASE: kinga_ci_test
          MARIADB_USER: kinga_ci_runner
          MARIADB_PASSWORD: kinga_ci_runner
        ports:
          - 127.0.0.1:33306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      KINGA_CI_DATABASE_URL: mysql://kinga_ci_runner:kinga_ci_runner@127.0.0.1:33306/kinga_ci_test
      KINGA_CI_ROOT_PASSWORD: kinga_ci_root
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; package.json is the single version source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install lockfile-pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Install local test utilities
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client
      - name: Provision disposable isolated test database
        run: pnpm exec tsx scripts/ci/provision-isolated-test-db.mjs
      - name: Check unresolved conflict markers
        run: pnpm run check:conflicts
      - name: Check provider-neutral runtime contracts
        run: pnpm test -- server/_core/runtime-readiness.test.ts server/_core/runtime-listen.test.ts
      - name: Bundle the server entry point
        run: pnpm run check:server
# This workflow is deliberately non-deploying. It has no cloud credentials,
# provider credentials, production environment, or staging connection. Its only
# database target is an ephemeral loopback MariaDB service required to satisfy
# the repository's fail-closed test-isolation guard.
