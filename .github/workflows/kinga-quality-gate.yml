name: KINGA Quality Gate

on:
  pull_request:
    branches:
      - main
      - feat/p0-b1-composed-fraud-boundary-final
      - test/p0-b1-canonical-report-flake
      - ci/p0-b1-stacked-quality-gate-routing
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kinga-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: kinga_ci_root
          MARIADB_DATABASE: kinga_ci_test
          MARIADB_USER: kinga_ci_runner
          MARIADB_PASSWORD: kinga_ci_runner
        ports:
          - 127.0.0.1:33306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      KINGA_CI_DATABASE_URL: mysql://kinga_ci_runner:kinga_ci_runner@127.0.0.1:33306/kinga_ci_test
      KINGA_CI_ROOT_PASSWORD: kinga_ci_root
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # exact immutable pull-request base is required for stacked typecheck comparison
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0; package.json is the single version source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install lockfile-pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Install local test utilities
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client poppler-utils
      - name: Provision disposable isolated test database
        run: pnpm exec tsx scripts/ci/provision-isolated-test-db.mjs
      - name: Prove WorkOS identity mapping migration
        run: pnpm exec tsx scripts/ci/prove-workos-identity-migration.mts
      - name: Reject unresolved conflict markers
        run: pnpm run check:conflicts
      - name: Verify Quality Gate trigger scope
        run: node scripts/ci/verify-quality-gate-trigger-scope.mjs
      - name: Verify Quality Gate guard regressions
        run: >-
          node --test scripts/ci/verify-quality-gate-trigger-scope.test.mjs
          scripts/ci/typecheck-stacked-base.test.mjs
      - name: TypeScript baseline comparison
        env:
          STACKED_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$STACKED_BASE_SHA" ]; then
            node scripts/ci/typecheck-stacked-base.mjs --base-sha "$STACKED_BASE_SHA"
          else
            node scripts/ci/typecheck-baseline.mjs
          fi
      - name: Upload TypeScript baseline report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kinga-typecheck-baseline-report
          path: ci/typecheck-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Full Vitest suite
        env:
          JWT_SECRET: ci-test-only-hs256-key-4f7a9c2e8d1b6f3a0c5e9b7d2f8a4c1e
          VITE_APP_ID: kinga-ci-test-app
        run: pnpm test
      - name: Production build
        run: pnpm build
