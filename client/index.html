<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>KINGA</title>
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.manuscdn.com/user_upload_by_module/session_file/310419663031527958/dOfoldGKvKSMqKYG.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://files.manuscdn.com/user_upload_by_module/session_file/310419663031527958/dOfoldGKvKSMqKYG.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10b981" />
    
    <!-- Inter font for Executive Dashboard premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet" />
    <!-- KINGA Design Prompt v2: Helvetica / system-ui for body; Courier New for monospace -->
    <style>
      /* Apply Helvetica/system-ui globally as per KINGA Design Prompt v2 */
      :root {
        --font-sans: Helvetica, Arial, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'Courier New', Courier, monospace;
      }
      body {
        font-family: var(--font-sans);
        font-weight: 400;
      }
      /* Executive Dashboard: scoped Inter typography for premium BI feel */
      .exec-dashboard {
        font-family: 'Inter', Helvetica, Arial, system-ui, sans-serif;
        font-feature-settings: 'tnum' 1, 'cv02' 1, 'cv03' 1, 'cv04' 1;
      }
      .exec-dashboard .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      /* Monospace: SHA-256 hash, document identity strip, run IDs */
      .font-mono, code, pre, .mono,
      .report-hash, .report-run-id, .report-identity {
        font-family: var(--font-mono) !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
